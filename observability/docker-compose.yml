# Stack observability untuk vm-obs (ClickHouse + Grafana + Vector aggregator).
# Kredensial dari .env (salin dari ../.env.example, chmod 600, jangan di-commit).
# Grafana hanya bind 127.0.0.1 (akses lewat IAP tunnel). ClickHouse tidak dipublish ke host.
name: lintas5g-obs

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.12-alpine
    restart: unless-stopped
    mem_limit: 4g
    env_file: [../.env]
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-poc_latency}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-poc}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD di .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "127.0.0.1:3000:3000"
    env_file: [../.env]
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD di .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - gf_data:/var/lib/grafana
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      clickhouse: { condition: service_healthy }

  vector:
    image: timberio/vector:0.43.1-debian
    restart: unless-stopped
    command: ["--config", "/etc/vector/vector.yaml"]
    env_file: [../.env]
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
    ports:
      - "6000:6000"   # batasi lewat firewall VPC: hanya dari subnet lab
    volumes:
      - ./vector/vector-aggregator.yaml:/etc/vector/vector.yaml:ro
      - vector_data:/var/lib/vector
    depends_on:
      clickhouse: { condition: service_healthy }

volumes:
  ch_data: {}
  gf_data: {}
  vector_data: {}
